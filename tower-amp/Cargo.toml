[package]
name = "tower-amp"
version = "0.5.0"
description = "Build Asynchronous Messaging Protocol (AMP) servers and clients with tower and tokio"
keywords = ["amp", "tower", "tokio", "twisted", "rpc"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
include = [
    "src/*.rs",
    "examples/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
]

[features]
# Logs what a connection would otherwise discard: a failed or panicking
# command, an accept error `serve` skipped, and a connection error that
# ended one of its connections. Nothing is sent to the peer that was not
# sent without it.
tracing = ["dep:tracing"]

[dependencies]
amp-protocol = { path = "../amp-protocol", version = "0.3.0", features = ["tokio"] }
futures-util = { workspace = true, features = ["sink"] }
serde = { workspace = true }
serde_amp = { path = "../serde_amp", version = "0.5" }
# Only the tokio features that build on every WebAssembly target go here;
# see the target tables below.
tokio = { workspace = true, features = ["io-util", "macros", "sync"] }
tokio-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-amp-macros = { path = "../tower-amp-macros", version = "0.2" }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }

# tokio has no networking on WebAssembly, so the server only builds
# elsewhere.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["net", "rt", "time"] }
# `rt` is for the task tracker `serve` waits on at shutdown.
tokio-util = { workspace = true, features = ["rt"] }

# On WASI (wasm32-wasip2) tokio's runtime and timers work, so a connection is
# driven as it is natively. Only the client builds there.
[target.'cfg(all(target_family = "wasm", target_os = "wasi"))'.dependencies]
tokio = { workspace = true, features = ["rt", "time"] }

# On wasm32-unknown-unknown there is no tokio runtime, so a connection is
# driven on the host's event loop and a timeout is a host timer. Only the
# client builds there.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
divan = "0.1"
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
tower = { workspace = true, features = ["timeout", "limit"] }
# Only for the test that asserts what the `tracing` feature logs.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

# On wasm32-unknown-unknown there is no tokio runtime to block on, so
# tests/client.rs runs under wasm-bindgen-test there; see DEVELOPING.md.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

# The tests run on wasm32-wasip2 too, where tokio has no multi-threaded
# runtime. `signal` is for the examples and the README, which stop on
# Ctrl-C.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# `Bytes` is tests/twisted.rs's AMP `String` argument.
bytes = { workspace = true, features = ["serde"] }
# `process` is for tests/twisted.rs, which runs the Python peer.
tokio = { workspace = true, features = ["process", "rt-multi-thread", "signal"] }
# Compiles the `#[command]` cases under tests/ui and checks the compiler's
# output, which needs cargo and so cannot run inside WebAssembly.
trybuild = "1"

# The bench drives a server, which does not build on WebAssembly; nothing
# builds benches there.
[[bench]]
name = "calls"
harness = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
