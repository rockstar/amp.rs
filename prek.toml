# Install the git hook once per clone with `prek install`.
# Every hook runs across the whole workspace, not just the staged crate.
default_install_hook_types = ["pre-commit", "commit-msg"]
# Hooks without an explicit `stages` only run at pre-commit, not again at commit-msg.
default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all -- --check"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-build"
name = "cargo build"
language = "system"
entry = "cargo build --workspace --all-targets --all-features"
types_or = ["rust", "toml"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
types_or = ["rust", "toml"]
pass_filenames = false

# Library targets only: the examples and tests need TCP and a multi-threaded
# tokio runtime. Needs `rustup target add wasm32-unknown-unknown wasm32-wasip2`.
[[repos.hooks]]
id = "cargo-clippy-wasm32-unknown-unknown"
name = "cargo clippy (wasm32-unknown-unknown)"
language = "system"
entry = "cargo clippy --workspace --all-features --target wasm32-unknown-unknown -- -D warnings"
types_or = ["rust", "toml"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy-wasm32-wasip2"
name = "cargo clippy (wasm32-wasip2)"
language = "system"
entry = "cargo clippy --workspace --all-features --target wasm32-wasip2 -- -D warnings"
types_or = ["rust", "toml"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-test"
name = "cargo test"
language = "system"
entry = "cargo test --workspace --all-features"
types_or = ["rust", "toml", "markdown"]
pass_filenames = false

# Needs wasmtime (see DEVELOPING.md); `.cargo/config.toml` names it as the
# runner. Unit and integration tests only: the examples need TCP, and
# doctests only run on the host.
[[repos.hooks]]
id = "cargo-test-wasm32-wasip2"
name = "cargo test (wasm32-wasip2)"
language = "system"
entry = "cargo test --workspace --all-features --target wasm32-wasip2 --tests"
types_or = ["rust", "toml"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-semver-checks"
name = "cargo semver-checks"
language = "system"
entry = "cargo semver-checks --workspace"
types_or = ["rust", "toml"]
pass_filenames = false

# Runs at the commit-msg stage, after the message is written. Rejects anything
# that is not a conventional commit: type(scope)?!?: subject
[[repos.hooks]]
id = "conventional-commit"
name = "conventional commit message"
language = "system"
entry = "sh -c 'grep -Eq \"^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9_-]+\\))?!?: .+\" \"$1\" || { echo \"commit message must be a conventional commit (type(scope)?: subject)\"; exit 1; }' --"
stages = ["commit-msg"]
