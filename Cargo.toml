[workspace]
# Resolver 3 (the 2024 default) skips dependency versions whose
# `rust-version` is above ours when it can.
resolver = "3"
members = ["amp-protocol", "serde_amp", "tower-amp", "tower-amp-macros"]

# Fields shared by every crate in the workspace. A crate opts in with
# `<field>.workspace = true` in its own Cargo.toml.
[workspace.package]
edition = "2024"
# Minimum supported Rust version. The current floor is the 2024 edition
# itself. CI checks every crate on exactly this toolchain, so bump it here
# when a newer feature is needed, and note the bump in that crate's release.
rust-version = "1.85"
authors = ["Paul Hummer <paul@eventuallyanyway.com>"]
license = "MIT"
repository = "https://github.com/rockstar/amp.rs"

[workspace.dependencies]
bytes = "1"
futures-util = "0.3"
proc-macro2 = "1"
quote = "1"
serde = "1"
syn = "2"
# 1.37 for `mpsc::Receiver::is_empty`.
tokio = { version = "1.37", default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }
tower = "0.5"
