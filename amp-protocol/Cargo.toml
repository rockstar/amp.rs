[package]
name = "amp-protocol"
version = "0.3.0"
description = "Wire format and message types for Asynchronous Messaging Protocol (AMP)"
keywords = ["amp", "protocol", "twisted", "networking"]
categories = ["network-programming", "encoding"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
]

[features]
# A tokio-util `Encoder`/`Decoder` for framing boxes on a byte stream.
tokio = ["dep:tokio-util", "dep:bytes"]

[dependencies]
bytes = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
divan = "0.1"
# Only for the `codec` doctest, which shows `Framed` over a tokio stream.
tokio = { workspace = true }

[[bench]]
name = "decode"
harness = false
# The bench drives the codec, so it only builds with the `tokio` feature.
required-features = ["tokio"]

[package.metadata.docs.rs]
all-features = true
