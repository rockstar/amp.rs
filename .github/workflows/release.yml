# Publish one workspace crate to crates.io when its release tag is pushed,
# then create the GitHub release for the tag with notes generated by
# ./release-notes.sh from the commits since the crate's previous release.
# Tags are named `<crate>-<version>`, for example `serde_amp-0.3.0`, and are
# normally created by ./release.sh (see DEVELOPING.md).
#
# Authentication uses crates.io Trusted Publishing, so no token is stored
# here. It must be registered once per crate by a crate owner, at
# https://crates.io/crates/<crate>/settings/new-trusted-publisher, with:
#
#   Repository owner    rockstar
#   Repository name     amp.rs
#   Workflow filename   release.yml
#   Environment         release
#
# A brand-new crate cannot use trusted publishing for its very first release:
# publish it once by hand with `cargo publish -p <crate>` and an API token,
# then register it as above.
name: release

on:
  push:
    tags:
      - "*-[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      crate: ${{ steps.tag.outputs.crate }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip2
          components: rustfmt, clippy
      - uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Parse the tag and check it against the crate's Cargo.toml
        id: tag
        run: |
          crate="${GITHUB_REF_NAME%-*}"
          version="${GITHUB_REF_NAME##*-}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')"
          echo "crate=$crate  tag version=$version  Cargo.toml version=${manifest_version:-<no such crate>}"
          if [ -z "$manifest_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' names crate '$crate', which is not a workspace member"
            exit 1
          fi
          if [ "$version" != "$manifest_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match $crate's Cargo.toml version '$manifest_version'"
            exit 1
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-features --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --workspace --all-features --target wasm32-wasip2 -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --all-features --target wasm32-wasip2 --tests
      - name: Dry-run the publish
        run: cargo publish --dry-run -p "${{ steps.tag.outputs.crate }}"

  publish:
    name: Publish ${{ needs.verify.outputs.crate }} to crates.io
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish -p "${{ needs.verify.outputs.crate }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Create the GitHub release for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: [verify, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The notes need every commit and tag back to the previous release.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Write the release notes
        run: |
          ./release-notes.sh "$GITHUB_REF_NAME" | tee notes.md

      # A rerun of the workflow updates the notes instead of failing on the
      # existing release.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ needs.verify.outputs.crate }}
        run: |
          version="${GITHUB_REF_NAME#"$CRATE-"}"
          title="$CRATE $version"
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md "${prerelease[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --notes-file notes.md "${prerelease[@]}"
          fi
