[workspace]
# Resolver 3 (the 2024 default) skips dependency versions whose
# `rust-version` is above ours when it can.
resolver = "3"
members = ["amp-protocol", "serde_amp", "tower-amp", "tower-amp-macros"]

# Fields shared by every crate in the workspace. A crate opts in with
# `<field>.workspace = true` in its own Cargo.toml.
[workspace.package]
edition = "2024"
# Minimum supported Rust version. The current floor is the 2024 edition
# itself. CI checks every crate on exactly this toolchain, so bump it here
# when a newer feature is needed, and note the bump in that crate's release.
rust-version = "1.85"
authors = ["Paul Hummer <paul@eventuallyanyway.com>"]
license = "MIT"
repository = "https://github.com/rockstar/amp.rs"

[workspace.dependencies]
bytes = "1"
futures-util = "0.3"
proc-macro2 = "1"
quote = "1"
serde = "1"
syn = "3"
# 1.37 for `mpsc::Receiver::is_empty`.
tokio = { version = "1.37", default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }
tower = "0.5"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
missing_debug_implementations = "deny"
missing_docs = "deny"
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unsafe_code = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_results = "deny"

# Spelling out `Formatter<'_>` and the like is noise the compiler infers correctly on its own.
# Part of rust_2018_idioms.
elided_lifetimes_in_paths = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# `#[expect]` warns when the lint it silences stops firing, so a stale
# silence cannot linger. `#[allow]` never does.
allow_attributes = "deny"
expect_used = "deny"
unwrap_used = "deny"
