name: build-and-check
on:
  push:
  pull_request:
jobs:
  build:
    name: Build workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release --all-features
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features
  # The interoperability tests in tower-amp/tests/twisted.rs are ignored by
  # default, since they need Twisted, and only run here.
  twisted:
    name: Test tower-amp against Twisted
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install twisted
      - run: cargo test -p tower-amp --all-features --test twisted -- --ignored
  check:
    name: Check workspace (lint, formatting, etc)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  wasm:
    name: Check workspace on ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip2]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      # Library targets only: the examples and tests need TCP and a
      # multi-threaded tokio runtime, which WebAssembly does not have.
      - run: cargo clippy --workspace --all-features --target ${{ matrix.target }} -- -D warnings
  test-wasi:
    name: Test workspace on wasm32-wasip2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # Unit and integration tests only: the examples need TCP, and doctests
      # only run on the host. The runner is set in .cargo/config.toml.
      - run: cargo test --workspace --all-features --target wasm32-wasip2 --tests
  # Only tower-amp's client runs in a browser, so this runs tests/client.rs
  # alone: the other tests need a server, and the unit tests a tokio runtime.
  # wasm-pack installs the wasm-bindgen-test-runner matching Cargo.lock and
  # runs the tests in Node. Not a prek hook, since it needs Node and wasm-pack.
  # No `--` before the cargo flags: wasm-pack would pass everything after it
  # to the test binary instead, and cargo would then build the examples too.
  test-browser:
    name: Test tower-amp's client on wasm32-unknown-unknown
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack test --node tower-amp --all-features --test client
  # A crate bumped by hand (because `cargo semver-checks` demanded it) must
  # be matched by a bump of every crate that exposes its types in a public
  # API, or consumers get the incompatible types from a patch release.
  # `cargo semver-checks` compares each crate's own items only, so this runs
  # semwave, which diffs the crate versions since the last release and walks
  # the workspace dependency graph. release.sh runs the same check.
  semver-deps:
    name: Check version bumps reach the crates that expose them
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          # The last release tag is the comparison base.
          fetch-depth: 0
      # semwave builds rustdoc JSON, which only nightly produces.
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install semwave --locked --version 0.6.2
      # Every release tags its HEAD, so the nearest tag is the last release.
      - run: semwave --no-color --source "$(git describe --tags --abbrev=0)" --target HEAD
  msrv:
    name: Check workspace on the minimum supported Rust version
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85
      # Library targets only: dev-dependencies do not affect what a consumer
      # of these crates needs, and may require a newer toolchain.
      - run: cargo check --workspace --all-features
