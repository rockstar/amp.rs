name: audit
# A new advisory can fail this with no change to the repository, so it also
# runs weekly, and it is a separate workflow so that run skips the build.
#
# Cargo.lock is not committed (these are all libraries), so the triggers are
# on the manifests and the lockfile is resolved fresh on every run.
on:
  push:
    paths: ["Cargo.toml", "*/Cargo.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.toml", "*/Cargo.toml", ".github/workflows/audit.yml"]
  schedule:
    - cron: "0 6 * * 1"
jobs:
  audit:
    name: Audit the resolved dependencies against the RustSec advisory database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo generate-lockfile
      # RUSTSEC-2026-0386: `AsyncFd::new` in tokio violates I/O safety. Nothing
      # in this workspace constructs an `AsyncFd`. Drop the ignore once a tokio
      # release with the fix is out.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2026-0386
