name: build-and-check
on:
  push:
  pull_request:
jobs:
  build:
    name: Build workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release --all-features
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features
  check:
    name: Check workspace (lint, formatting, etc)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  msrv:
    name: Check workspace on the minimum supported Rust version
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85
      # Library targets only: dev-dependencies do not affect what a consumer
      # of these crates needs, and may require a newer toolchain.
      - run: cargo check --workspace --all-features
