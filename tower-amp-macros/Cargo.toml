[package]
name = "tower-amp-macros"
version = "0.1.0"
description = "The #[command] attribute for tower-amp"
keywords = ["amp", "tower", "macros"]
categories = ["network-programming"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
